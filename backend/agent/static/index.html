<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Copilot">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    display: flex; flex-direction: column;
    height: 100vh;
    color: #1d1d1f;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5ea;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .meta { font-size: 12px; color: #86868b; }
  header button {
    background: #007aff; color: #fff; border: none;
    padding: 6px 14px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
  }
  header button:hover { background: #0066d6; }

  #chat {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
  }
  .msg.user .avatar { background: #007aff; color: #fff; }
  .msg.assistant .avatar { background: #e5e5ea; color: #1d1d1f; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 75%;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: #007aff; color: #fff; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e5e5ea; }

  .reasoning {
    font-size: 12px; color: #86868b;
    font-style: italic;
    padding: 4px 0;
    display: none;
  }
  .reasoning.active { display: block; }

  .cursor::after {
    content: "▊"; animation: blink 1s infinite;
    margin-left: 2px; color: #007aff;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    background: #fff; border-top: 1px solid #e5e5ea;
    padding: 12px 20px;
  }
  .input-wrap {
    max-width: 900px; margin: 0 auto;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d2d2d7; border-radius: 10px;
    font-size: 14px; font-family: inherit;
    resize: none; outline: none;
    line-height: 1.5; max-height: 120px;
  }
  #input:focus { border-color: #007aff; }
  #send {
    padding: 0 20px;
    background: #007aff; color: #fff; border: none;
    border-radius: 10px; font-size: 14px; cursor: pointer;
    font-weight: 500;
  }
  #send:disabled { background: #b0b0b5; cursor: not-allowed; }
  #send:hover:not(:disabled) { background: #0066d6; }

  .error {
    color: #ff3b30; font-size: 13px;
    text-align: center; padding: 4px;
  }




/* ========== Markdown 渲染样式 ========== */
.bubble p { margin: 6px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }

.bubble h1, .bubble h2, .bubble h3 {
  margin: 12px 0 6px;
  font-weight: 600;
  line-height: 1.3;
}
.bubble h1 { font-size: 18px; }
.bubble h2 { font-size: 16px; }
.bubble h3 { font-size: 15px; }

.bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
.bubble li { margin: 3px 0; }

.bubble code {
  background: #f0f0f3;
  padding: 2px 5px;
  border-radius: 4px;
  font-family: "Consolas", "Monaco", monospace;
  font-size: 13px;
}
.bubble pre {
  background: #f6f6f8;
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid #e5e5ea;
}
.bubble pre code {
  background: transparent;
  padding: 0;
  font-size: 13px;
  line-height: 1.5;
}

.bubble blockquote {
  border-left: 3px solid #d2d2d7;
  padding-left: 12px;
  margin: 8px 0;
  color: #6e6e73;
}

.bubble table {
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 13px;
  display: block;
  overflow-x: auto;
  max-width: 100%;
}
.bubble th, .bubble td {
  border: 1px solid #d2d2d7;
  padding: 6px 10px;
  text-align: left;
}
.bubble th { background: #f6f6f8; font-weight: 600; }

.bubble a { color: #007aff; text-decoration: none; }
.bubble a:hover { text-decoration: underline; }

.bubble hr { border: none; border-top: 1px solid #e5e5ea; margin: 12px 0; }

/* 用户气泡不加 markdown 样式（用户消息就是纯文本） */
.msg.user .bubble p { margin: 0; }  

/* ========== 耗时标签 ========== */
.elapsed {
  font-size: 11px;
  color: #86868b;
  margin-top: 4px;
  padding: 0 4px;
  user-select: none;
}
.elapsed .sep { margin: 0 6px; opacity: 0.5; }

#imagePreview {
  position: relative;
  margin-bottom: 8px;
}
#imagePreview img {
  max-height: 100px;
  border-radius: 8px;
  border: 1px solid #d2d2d7;
}

#imagePreview .remove {
  position: absolute;
  top: -6px; right: -6px;
  background: #ff3b30; color: white;
  border-radius: 50%; width: 20px; height: 20px;
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  border: none;
}

/* ========== 聊天图片 ========== */
.bubble .chat-img {
  max-width: 240px;
  max-height: 240px;
  border-radius: 8px;
  cursor: zoom-in;
  display: block;
  margin-bottom: 6px;
  transition: opacity .15s;
}
.bubble .chat-img:hover { opacity: .9; }

/* ========== Lightbox ========== */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#lightbox.active { display: flex; }
#lightbox img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
  border-radius: 8px;
}
#lightbox .hint {
  position: absolute;
  bottom: 20px;
  color: #fff;
  font-size: 13px;
  opacity: .7;
}
/* ========== 移动端 Tab 布局 ========== */
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#app {
  flex: 1;
  overflow: hidden;
  position: relative;
}
#page-task-detail.active {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #f5f5f7;
}
.page {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.page.active { display: flex; }

.page-header {
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  padding: 16px 20px;
  font-size: 22px;
  font-weight: 700;
}
.page-header h1 { font-size: 22px; margin: 0; }

.placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #86868b;
  font-size: 14px;
}

/* 底部 Tab 栏 */
#tabbar {
  display: flex;
  height: 60px;
  background: #fff;
  border-top: 1px solid #e5e5ea;
  padding-bottom: env(safe-area-inset-bottom);   /* iPhone 底部安全区 */
  flex-shrink: 0;
}

#tabbar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: transparent;
  border: none;
  color: #86868b;
  font-size: 11px;
  cursor: pointer;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
#tabbar .tab span {
  font-size: 20px;
  line-height: 1;
}
#tabbar .tab.active {
  color: #007aff;
}
#tabbar .tab:active {
  background: #f0f0f3;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.scroll-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}

.memory-group {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #e5e5ea;
}

.memory-group h3 {
  font-size: 14px;
  color: #86868b;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.memory-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f3;
  font-size: 14px;
}
.memory-item:last-child { border-bottom: none; }
.memory-item .key { color: #86868b; }
.memory-item .value { color: #1d1d1f; font-weight: 500; }
/* ========== 记忆页 Tab ========== */
.memory-tabs {
  display: flex;
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  flex-shrink: 0;
}
.memory-tab {
  flex: 1;
  padding: 12px 0;
  background: transparent;
  border: none;
  color: #86868b;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.memory-tab.active {
  color: #007aff;
  border-bottom-color: #007aff;
  font-weight: 500;
}

/* 折叠区（transient） */
.memory-transient {
  margin-top: 16px;
  background: #fafafa;
  border-radius: 12px;
  border: 1px dashed #d2d2d7;
}
.memory-transient-header {
  padding: 12px 16px;
  font-size: 13px;
  color: #86868b;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
.memory-transient-body {
  display: none;
  padding: 0 16px 12px;
}
.memory-transient.expanded .memory-transient-body {
  display: block;
}
.memory-transient .memory-item {
  opacity: 0.7;
}
/* ========== 任务页 ========== */
.task-subtabs {
  display: flex;
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  flex-shrink: 0;
}
.task-subtab {
  flex: 1;
  padding: 12px 0;
  background: transparent;
  border: none;
  color: #86868b;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.task-subtab.active {
  color: #007aff;
  border-bottom-color: #007aff;
  font-weight: 500;
}

.task-categories {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: #f5f5f7;
  overflow-x: auto;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
.task-categories::-webkit-scrollbar { display: none; }
.cat-btn {
  padding: 6px 14px;
  background: #fff;
  border: 1px solid #e5e5ea;
  border-radius: 16px;
  font-size: 13px;
  color: #1d1d1f;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.cat-btn.active {
  background: #007aff;
  color: #fff;
  border-color: #007aff;
}

/* 任务卡片 */
.task-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #e5e5ea;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: box-shadow 0.15s;
}
.task-card:active { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.task-card .task-icon {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}
.task-card .task-body { flex: 1; min-width: 0; }
.task-card .task-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
  color: #1d1d1f;
}
.task-card .task-desc {
  font-size: 13px;
  color: #86868b;
  line-height: 1.4;
}
.task-card .task-run-btn {
  background: #007aff;
  color: #fff;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.task-card .task-run-btn:active { background: #0066d6; }
.task-card .task-run-btn:disabled { background: #b0b0b5; }

/* 执行面板 */
.task-run-panel {
  display: none;
  position: fixed;
  bottom: 60px;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #e5e5ea;
  max-height: 60vh;
  flex-direction: column;
  z-index: 999;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
}
.task-run-panel.active { display: flex; }
.task-run-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #e5e5ea;
  font-weight: 600;
  font-size: 15px;
}
.task-run-output {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
/* ========== 任务编辑弹窗 ========== */
.task-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.task-modal.active { display: flex; }

.task-modal-content {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.task-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid #e5e5ea;
}
.task-modal-header h2 { font-size: 16px; font-weight: 600; }

.task-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.task-modal-body label {
  font-size: 13px;
  color: #86868b;
  margin-top: 8px;
}
.task-modal-body input[type="text"],
.task-modal-body textarea,
.task-modal-body select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d2d2d7;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.task-modal-body input:focus,
.task-modal-body textarea:focus,
.task-modal-body select:focus {
  border-color: #007aff;
}
.task-modal-body textarea {
  resize: vertical;
  min-height: 100px;
  line-height: 1.5;
}

.task-modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid #e5e5ea;
}
.btn-cancel, .btn-save {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  border: none;
}
.btn-cancel {
  background: #f0f0f3;
  color: #1d1d1f;
}
.btn-save {
  background: #007aff;
  color: #fff;
  font-weight: 500;
}
.btn-save:disabled { background: #b0b0b5; cursor: not-allowed; }

/* 任务卡片按钮组 */
.task-card .task-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

/* 删除按钮：红底圆形 */
.task-card .task-del-btn {
  background: #fff0f0;
  color: #ff3b30;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.task-card .task-del-btn:active {
  background: #ffe0e0;
}

/* ========== 任务创建提示条 ========== */
.task-draft-banner {
  background: #fffbea;
  border: 1px solid #f0d97a;
  border-radius: 10px;
  padding: 12px 16px;
  margin: 0 auto 12px;
  max-width: 900px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.task-draft-banner button {
  background: transparent;
  border: 1px solid #d2a500;
  color: #d2a500;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.task-draft-banner button:hover {
  background: #f0d97a;
  color: #fff;
}

/* ========== 任务页分组 ========== */
.task-section {
  margin-bottom: 24px;
}
.section-title {
  font-size: 13px;
  color: #86868b;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-bottom: 10px;
  padding-left: 4px;
}

/* 执行记录卡片 */
.run-item {
  background: #fff;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  border: 1px solid #e5e5ea;
  cursor: pointer;
  transition: box-shadow 0.15s;
}
.run-item:active { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.run-item .run-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.run-item .run-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.run-item .run-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.run-item .run-meta {
  font-size: 11px;
  color: #86868b;
  white-space: nowrap;
}
.run-item .run-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #e6f4ea;
  color: #1e8e3e;
  white-space: nowrap;
}
.run-item .run-status.failed {
  background: #fce8e6;
  color: #c5221f;
}
.run-item .run-output {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f0f0f3;
  font-size: 13px;
  line-height: 1.5;
  color: #1d1d1f;
  max-height: 240px;
  overflow-y: auto;
}
.run-item .run-output p { margin: 4px 0; }
.run-item.expanded .run-output { display: block; }
/* ========== 任务详情页 ========== */
.task-detail-header {
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  padding: 12px 12px 12px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.back-btn {
  background: transparent;
  border: none;
  font-size: 22px;
  color: #007aff;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
}
.back-btn:active { opacity: 0.5; }

.detail-run-btn {
  background: #007aff;
  color: #fff;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-run-btn:active { background: #0066d6; }
.detail-run-btn:disabled { background: #b0b0b5; }

.chat-messages {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px;
}

/* 详情页输入区样式跟聊天页一致（复用 .input-wrap / textarea） */
#task-detail-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #d2d2d7;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  line-height: 1.5;
  max-height: 120px;
}
#task-detail-input:focus { border-color: #007aff; }

#task-detail-send {
  padding: 0 20px;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
#task-detail-send:hover { background: #0066d6; }
/* ========== 任务详情 - 配置区 ========== */
.task-config {
  background: #fff;
  padding: 4px 20px 12px;
  border-bottom: 1px solid #e5e5ea;
  flex-shrink: 0;
}
.config-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;

<script>
const API = "";  // 同源，留空
const TOKEN_KEY = "agent_api_token";
function getAuthHeaders() {
  const t = localStorage.getItem(TOKEN_KEY) || "";
  return t ? { "Authorization": "Bearer " + t } : {};
}
const CHAT_EL = document.getElementById("chat");
const INPUT_EL = document.getElementById("input");
const SEND_EL = document.getElementById("send");
const META_EL = document.getElementById("sessionId");

let sessionId = localStorage.getItem("agent_session_id") || "main";
localStorage.setItem("agent_session_id", sessionId);
META_EL.textContent = sessionId;

let busy = false;
let currentAbort = null;
const STOP_EL = document.getElementById("stop");

async function stopGeneration() {
  // 1. 先发 cancel 请求（关键：在 abort 之前）
  const cancelPromise = fetch(API + "/chat/cancel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId }),
  }).catch((e) => console.error("取消失败:", e));

  // 2. 等 300ms，让 cancel 请求先到后端
  await new Promise((r) => setTimeout(r, 300));

  // 3. 再 abort 前端 fetch
  if (currentAbort) {
    currentAbort.abort();
    currentAbort = null;
  }

  // 4. 等 cancel 完成
  await cancelPromise;

  // 5. UI 恢复
  STOP_EL.style.display = "none";
  SEND_EL.style.display = "block";
  SEND_EL.disabled = false;
  busy = false;
}
let pendingImage = null;   // { base64: string, dataUrl: string }

const IMG_INPUT = document.getElementById("imageInput");
const IMG_PREVIEW = document.getElementById("imagePreview");

IMG_INPUT.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    alert("图片不能超过 10MB（原图）");
    return;
  }

  // 1. 读取原始图片
  const rawDataUrl = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });

  // 2. 压缩
  const { dataUrl, mime, base64 } = await compressImage(rawDataUrl);

  // 3. 更新预览
  pendingImage = { base64, dataUrl, mime };
  IMG_PREVIEW.style.display = "block";
  IMG_PREVIEW.innerHTML = `
    <img src="${dataUrl}" />
    <button class="remove" onclick="clearImage()">×</button>
  `;
  IMG_INPUT.value = "";  // 允许重复选同一文件
});

/**
 * 压缩图片：
 * - 最长边不超过 1600px
 * - 输出 JPEG，质量 85%
 * - 保留 PNG 透明通道（如果原图是 PNG 且有透明像素）
 */
async function compressImage(rawDataUrl) {
  const MAX_DIM = 1600;
  const JPEG_QUALITY = 0.85;

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;

      // 等比缩放到最长边 1600
      if (Math.max(width, height) > MAX_DIM) {
        const ratio = MAX_DIM / Math.max(width, height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }

      // 用 canvas 绘制
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      // 统一输出 JPEG（体积小，OCR 无所谓透明）
      const mime = "image/jpeg";
      const dataUrl = canvas.toDataURL(mime, JPEG_QUALITY);
      const base64 = dataUrl.split(",")[1];

      resolve({ dataUrl, mime, base64 });
    };
    img.onerror = () => reject(new Error("图片加载失败"));
    img.src = rawDataUrl;
  });
}

function clearImage() {
  pendingImage = null;
  IMG_PREVIEW.style.display = "none";
  IMG_PREVIEW.innerHTML = "";
}




function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  document.getElementById("lightboxImg").src = src;
  lb.classList.add("active");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}
// ESC 关闭
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});
// 事件委托：任何 .bubble 里的图都能点开
document.addEventListener("click", (e) => {
  if (e.target.tagName === "IMG" && e.target.closest(".bubble")) {
    openLightbox(e.target.src);
  }
});



async function loadHistory(sid) {
  CHAT_EL.innerHTML = "";
  // 切到非任务会话时，清掉任务提示条
  if (!sid.startsWith("task-")) {
    document.getElementById("task-draft-banner")?.remove();
  }
  try {
    const r = await fetch(API + `/sessions/${encodeURIComponent(sid)}/history`);
    if (!r.ok) return;
    const data = await r.json();

    let prevArchived = null;

    data.messages.forEach(m => {
      const isArchived = !!m.archived;

      // 状态切换时插入分隔线
      if (prevArchived !== null && prevArchived !== isArchived) {
        const sep = document.createElement("div");
        sep.className = "history-divider";
        sep.textContent = isArchived ? "📦 以下为压缩历史" : "✨ 以下为活跃对话";
        CHAT_EL.appendChild(sep);
      }
      if (prevArchived === null && isArchived) {
        const sep = document.createElement("div");
        sep.className = "history-divider";
        sep.textContent = "📦 以下为压缩历史";
        CHAT_EL.appendChild(sep);
      }
      prevArchived = isArchived;

      const role = m.role === "user" ? "user" : "assistant";
      const { wrap, bubble } = addMsg(role);

      if (role === "assistant") {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(m.content));
        // 中断标记
        if (m.interrupted) {
          const tip = document.createElement("div");
          tip.style.cssText = "color:#86868b;font-size:12px;margin-top:6px;";
          tip.textContent = "（已中断）";
          bubble.appendChild(tip);
        }
        // 耗时渲染
        if (m.elapsed_ms != null) {
          const meta = document.createElement("div");
          meta.className = "elapsed";
          let html = `⏱ ${formatMs(m.elapsed_ms)}`;
          if (m.ttft_ms != null) {
            html += `<span class="sep">·</span>首字 ${formatMs(m.ttft_ms)}`;
          }
          meta.innerHTML = html;
          wrap.appendChild(meta);
        }
      } else {
        let html = "";
        if (m.image_path) {
          html += `<img src="/uploads/${m.image_path}" class="chat-img" alt="用户上传的图片">`;
        }
        if (m.content) {
          html += `<span>${escapeHtml(m.content)}</span>`;
        }
        bubble.innerHTML = html;
      }

      if (isArchived) {
        bubble.style.opacity = "0.6";
        bubble.style.borderStyle = "dashed";
        bubble.title = "此消息已进入压缩历史，不再参与 AI 上下文";
      }
    });
  } catch (e) {

}
function genSessionId() {
  return "web-" + Math.random().toString(36).slice(2, 10);
}
function formatMs(ms) {
  if (ms < 1000) return `${ms}ms`;
  return `${(ms / 1000).toFixed(1)}s`;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;",
  })[c]);
}

function addMsg(role, text = "") {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `
    <div class="avatar">${role === "user" ? "你" : "AI"}</div>

  `;

  if (text) bubble.textContent = text;
  CHAT_EL.appendChild(wrap);
  CHAT_EL.scrollTop = CHAT_EL.scrollHeight;
  return { wrap, bubble };
}

async function send() {
  const text = INPUT_EL.value.trim();
  if (!text && !pendingImage) return;   // ← 允许"只发图不写字"


  busy = true;
  SEND_EL.disabled = true;
  SEND_EL.style.display = "none";
  STOP_EL.style.display = "block";
  currentAbort = new AbortController();
  INPUT_EL.value = "";
  INPUT_EL.style.height = "auto";

  const { bubble: userBubble } = addMsg("user");
  if (pendingImage) {
    const img = document.createElement("img");
    img.src = pendingImage.dataUrl;
    img.className = "chat-img";
    img.alt = "用户上传的图片";
    userBubble.appendChild(img);
  }
  if (text) {
    const span = document.createElement("span");
    span.textContent = text;
    userBubble.appendChild(span);
  }
  
  const { wrap: aiWrap, bubble: aiBubble } = addMsg("assistant");
  aiBubble.classList.add("cursor");

  // reasoning 显示（可选）
  const reasoning = document.createElement("div");
  reasoning.className = "reasoning";
  aiWrap.insertBefore(reasoning, aiBubble);

  try {
    const resp = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        message: text,
        image_base64: pendingImage ? pendingImage.base64 : null,
        image_mime: pendingImage ? pendingImage.mime : null,
      }),
        signal: currentAbort.signal, 
    });

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let reasoningChars = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 按 \n\n 分帧
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        if (!raw.startsWith("data: ")) continue;
        const jsonStr = raw.slice(6);
        let evt;
        try { evt = JSON.parse(jsonStr); } catch { continue; }

        if (evt.kind === "content") {
          aiBubble.textContent += evt.text;
          CHAT_EL.scrollTop = CHAT_EL.scrollHeight;
        } else if(evt.kind == "status") {
            reasoning.textContent = evt.text;
            reasoning.classList.add("active");
        } else if (evt.kind === "reasoning") {
          reasoningChars += evt.text.length;
          reasoning.textContent = `思考中… ${reasoningChars} 字`;
          reasoning.classList.add("active");
          CHAT_EL.scrollTop = CHAT_EL.scrollHeight;
        } else if (evt.kind === "done") {
          reasoning.classList.remove("active");
          const finalText = aiBubble.textContent || evt.reply || "";
          aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(finalText));

          // 渲染耗时
          const elapsed = evt.elapsed_ms;
          const ttft = evt.ttft_ms;
          if (elapsed != null) {
            const meta = document.createElement("div");
            meta.className = "elapsed";
            let html = `⏱ ${formatMs(elapsed)}`;
            if (ttft != null) {
              html += `<span class="sep">·</span>首字 ${formatMs(ttft)}`;
                }
            meta.innerHTML = html;
            aiBubble.parentElement.appendChild(meta);
        }
        CHAT_EL.scrollTop = CHAT_EL.scrollHeight;

               } else if (evt.kind === "interrupted") {
          reasoning.classList.remove("active");
          aiBubble.classList.remove("cursor");
          // 保留已生成内容，加"（已中断）"标记
          const partialText = aiBubble.textContent || evt.partial || "";
          if (partialText) {
            aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(partialText));
            const tip = document.createElement("div");
            tip.style.cssText = "color:#86868b;font-size:12px;margin-top:6px;";
            tip.textContent = "（已中断）";
            aiBubble.appendChild(tip);
          }
        } else if (evt.kind === "tool_call") {
          // 任务创建会话里，finalize_task 成功后隐藏提示条
          if (evt.name === "finalize_task" && evt.success) {
            const banner = document.getElementById("task-draft-banner");
            if (banner) {
              banner.style.background = "#e6f4ea";
              banner.style.borderColor = "#34a853";
              banner.innerHTML = `
                <div>
                  ✅ <strong>任务创建完成</strong>
                  <br><span style="font-size:12px;color:#1e8e3e;">
                    可在「任务」页查看和管理
                  </span>
                </div>
              `;
              // 3 秒后自动消失
              setTimeout(() => banner.remove(), 3000);
            }
          }
        }
        
        else if (evt.kind === "error") {
          aiBubble.textContent = "";
          aiBubble.innerHTML = `<span class="error">❌ ${evt.error}</span>`;
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      // 用户主动停止，UI 由 interrupted 事件处理
      console.log("生成已中断");
    } else {
      aiBubble.textContent = "";
      aiBubble.innerHTML = `<span class="error">❌ ${e.message}</span>`;
    }
  } finally {
    aiBubble.classList.remove("cursor");
    busy = false;
    currentAbort = null;
    SEND_EL.disabled = false;
    SEND_EL.style.display = "block";
    STOP_EL.style.display = "none";
    INPUT_EL.focus();

  }
}

const CATEGORY_LABELS = {
  // user 域

let currentMemoryScope = "user";
let memoryCache = null;

async function loadMemories() {
  const el = document.getElementById("memory-content");
  el.innerHTML = '<div class="placeholder">加载中…</div>';

  try {
    const r = await fetch(API + "/memories", {
      headers: { ...getAuthHeaders() },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    memoryCache = data.scopes || {};
    renderMemories();
  } catch (e) {
    el.innerHTML = `<div class="placeholder">❌ 加载失败：${e.message}</div>`;
  }
}

function renderMemories() {
  const el = document.getElementById("memory-content");
  const scopeData = (memoryCache || {})[currentMemoryScope] || {};

  // 分离稳定 / 临时
  const stable = {};      // { category: [items] }
  const transient = [];   // [items]

  for (const [cat, items] of Object.entries(scopeData)) {
    for (const item of items) {
      if (item.lifetime === "transient") {
        transient.push(item);
      } else {
        stable[cat] = stable[cat] || [];
        stable[cat].push(item);
      }
    }
  }

  // 空状态
  if (Object.keys(stable).length === 0 && transient.length === 0) {
    const hint = currentMemoryScope === "user"
      ? '试着说："记住我在南京"'
      : '试着说："以后你叫小林"';
    el.innerHTML = `<div class="placeholder">🧠 还没有任何记忆<br><small>${hint}</small></div>`;
    return;
  }

  el.innerHTML = "";

  // 按固定顺序展示 category
  const ORDER = ["profile", "work", "lifestyle", "tools", "goals", "routine",
                 "character", "tone", "constraints", "general"];
  const sorted = Object.keys(stable).sort((a, b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  for (const cat of sorted) {
    const group = document.createElement("div");
    group.className = "memory-group";
    const label = CATEGORY_LABELS[cat] || `📁 ${cat}`;
    group.innerHTML = `<h3>${label}</h3>`;

    for (const item of stable[cat]) {
      group.appendChild(buildMemoryItem(item));
    }
    el.appendChild(group);
  }

  // 临时区（折叠）
  if (transient.length > 0) {
    const transEl = document.createElement("div");
    transEl.className = "memory-transient";
    transEl.innerHTML = `
      <div class="memory-transient-header">
        <span>⏳ 临时（${transient.length}）</span>
        <span style="font-size:11px;">点击展开 ▾</span>
      </div>
      <div class="memory-transient-body"></div>
    `;
    const body = transEl.querySelector(".memory-transient-body");
    for (const item of transient) {
      body.appendChild(buildMemoryItem(item));
    }
    transEl.querySelector(".memory-transient-header").addEventListener("click", () => {
      transEl.classList.toggle("expanded");
    });
    el.appendChild(transEl);
  }
}

function buildMemoryItem(item) {
  const row = document.createElement("div");
  row.className = "memory-item";
  row.innerHTML = `
    <span class="key">${escapeHtml(item.key)}</span>
    <span class="value">${escapeHtml(item.value)}</span>

// ─── 任务 Tab：今天 / 昨天 / 为你推荐 ───
async function renderTaskTab(el) {
  const r = await fetch(API + "/tasks?status=all", { headers: { ...getAuthHeaders() } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const { tasks } = await r.json();

  // 我的任务 = active 且非内置
  const myTasks = tasks.filter((t) => !t.is_builtin && t.status === "active");
  const recommended = tasks.filter((t) => t.is_builtin);

  // 按 updated_at（UTC，跟 DB 一致）分组
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const yesterdayStr = new Date(now.getTime() - 86400000).toISOString().slice(0, 10);
  const cutoffStr = new Date(now.getTime() - 7 * 86400000).toISOString().slice(0, 10);

  const groups = { today: [], yesterday: [], recent: [] };
  for (const t of myTasks) {
    const d = (t.updated_at || t.created_at || "").slice(0, 10);
    if (d === todayStr) groups.today.push(t);
    else if (d === yesterdayStr) groups.yesterday.push(t);
    else if (d >= cutoffStr) groups.recent.push(t);
  }

  el.innerHTML = "";

  // 空状态
  if (myTasks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "task-section";
    empty.innerHTML = `
      <h2 class="section-title">我的任务</h2>
      <div style="color:#86868b;font-size:13px;padding:8px 4px;line-height:1.6;">
        还没有任务。点右上角"+ 新建"，或从下方"为你推荐"里选一个。
      </div>
    `;
    el.appendChild(empty);
  } else {
    for (const [key, label] of [["today", "今天"], ["yesterday", "昨天"], ["recent", "近 7 天"]]) {
      if (groups[key].length === 0) continue;
      const section = document.createElement("div");
      section.className = "task-section";
      const title = document.createElement("h2");
      title.className = "section-title";
      title.textContent = label;
      section.appendChild(title);
      for (const t of groups[key]) {
        section.appendChild(buildTaskCard(t));
      }
      el.appendChild(section);
    }
  }

  // 为你推荐（随机 4 个）
  const recSection = document.createElement("div");
  recSection.className = "task-section";
  const recTitle = document.createElement("h2");
  recTitle.className = "section-title";
  recTitle.textContent = "为你推荐";
  recSection.appendChild(recTitle);

  if (recommended.length === 0) {
    const e = document.createElement("div");
    e.style.cssText = "color:#c7c7cc;font-size:13px;padding:8px 4px;";
    e.textContent = "（无）";
    recSection.appendChild(e);
  } else {
    const shuffled = [...recommended].sort(() => Math.random() - 0.5);
    const picked = shuffled.slice(0, 4);
    for (const t of picked) {
      recSection.appendChild(buildTaskCard(t));
    }
  }
  el.appendChild(recSection);
}

// ─── 定时 Tab：进行中 / 为你推荐 ───

  // 按 enabled 分组

    const pausedTitle = document.createElement("h2");
    pausedTitle.className = "section-title";
    pausedTitle.textContent = "已暂停";
    pausedSection.appendChild(pausedTitle);

    for (const t of paused) {
      pausedSection.appendChild(buildTaskCard(t, "scheduled"));
    }
    el.appendChild(pausedSection);
  }
  // ─── 为你推荐 ───
  const recSection = document.createElement("div");
  recSection.className = "task-section";
  const recTitle = document.createElement("h2");
  recTitle.className = "section-title";
  recTitle.textContent = "为你推荐";

  // 拉所有内置任务作为"定时模板"

      const { tasks: allTasks } = await allResp.json();
      const builtin = allTasks.filter((t) => t.is_builtin);

      if (builtin.length === 0) {
        const hint = document.createElement("div");
        hint.style.cssText = "color:#86868b;font-size:13px;padding:8px 4px;";
        hint.textContent = "说一句「每天早上 8 点提醒我…」即可创建定时任务";
        recSection.appendChild(hint);

          const picked = shuffled.slice(0, 3);
          for (const t of picked) {
              recSection.appendChild(buildTaskCard(t, "manual"));
          } 
        }
      }
    }
  } catch (e) {

  }

  el.appendChild(recSection);

}
// ─── 构造：执行记录卡片 ───
function buildRunSection(titleText, runs) {
  const section = document.createElement("div");
  section.className = "task-section";
  const title = document.createElement("h2");
  title.className = "section-title";
  title.textContent = titleText;
  section.appendChild(title);

  if (runs.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "color:#c7c7cc;font-size:13px;padding:8px 4px;";

    section.appendChild(empty);

  }
  for (const r of runs) {
    section.appendChild(buildRunItem(r));
  }

function buildRunItem(run) {
  const el = document.createElement("div");
  el.className = "run-item";

  const time = (run.run_at || "").slice(11, 16);
  const duration = run.duration_ms ? `${(run.duration_ms / 1000).toFixed(1)}s` : "";
  const statusClass = run.status === "success" ? "" : "failed";
  const statusText =
    run.status === "success" ? "成功" :
    run.status === "failed" ? "失败" : "运行中";

  el.innerHTML = `
    <div class="run-header">
      <span class="run-icon">${escapeHtml(run.task_icon || "📋")}</span>
      <span class="run-name">${escapeHtml(run.task_name || "(已删除任务)")}</span>
      <span class="run-meta">${time} · ${duration}</span>
      <span class="run-status ${statusClass}">${statusText}</span>
      <button class="run-menu-btn" title="更多">⋯</button>
    </div>
  `;

  // 点 ⋯ → 菜单
  const menuBtn = el.querySelector(".run-menu-btn");
  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    showRunMenu(e, run);
  });

  // 点本体 → 进会话页
  if (run.task_id) {
    el.style.cursor = "pointer";
    el.addEventListener("click", async () => {
      try {
        const allResp = await fetch(API + "/tasks?status=all", {
          headers: { ...getAuthHeaders() },
        });
        let task = null;
        if (allResp.ok) {
          const allData = await allResp.json();
          task = (allData.tasks || []).find((t) => t.id === run.task_id);
        }
        if (!task) {
          task = {
            id: run.task_id,
            name: run.task_name || "任务",
            icon: run.task_icon || "📋",
            prompt: "",
            description: "",
            trigger_type: "manual",
            enabled: 0,
          };
        }
        openTaskSession(task);
      } catch (e) {
        alert("打开会话失败：" + e.message);
      }
    });
  }

  return el;
}

// runs 的 ⋯ 菜单
function showRunMenu(event, run) {
  const dropdown = document.getElementById("task-menu-dropdown");
  const items = [

}

// cron → 人话（前端副本，仅展示用）
function _humanCron(expr) {
  if (!expr) return "";
  const p = expr.split(" ");
  if (p.length !== 5) return expr;
  const [mi, hr, dom, mon, dow] = p;

  if (dom === "*" && mon === "*" && dow === "*" && mi !== "*" && hr !== "*") {
    return `每天 ${hr.padStart(2, "0")}:${mi.padStart(2, "0")}`;
  }
  if (dom === "*" && mon === "*" && dow !== "*" && mi !== "*" && hr !== "*") {
    const names = ["日", "一", "二", "三", "四", "五", "六"];
    return `每周${names[parseInt(dow)] || dow} ${hr.padStart(2, "0")}:${mi.padStart(2, "0")}`;
  }
  if (dom !== "*" && mon === "*" && dow === "*" && mi !== "*" && hr !== "*") {
    return `每月 ${dom} 号 ${hr.padStart(2, "0")}:${mi.padStart(2, "0")}`;
  }
  return expr;
}

async function runTask(taskId, taskName, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "…"; }

  const panel = document.getElementById("task-run-panel");
  const title = document.getElementById("task-run-title");
  const output = document.getElementById("task-run-output");
  panel.classList.add("active");
  title.textContent = taskName;
  output.textContent = "执行中…";

  try {
    const r = await fetch(API + `/tasks/${taskId}/run`, {
      method: "POST",
      headers: { ...getAuthHeaders() },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let content = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;
        try {
          const evt = JSON.parse(raw.slice(6));
          if (evt.kind === "content") {
            content += evt.text;
            output.textContent = content;
            output.scrollTop = output.scrollHeight;
          } else if (evt.kind === "error") {
            output.textContent = "❌ " + evt.error;
          }
        } catch { continue; }
      }
    }
    // 最终 Markdown 渲染
    output.innerHTML = DOMPurify.sanitize(marked.parse(content));
  } catch (e) {
    output.textContent = "❌ " + e.message;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "▶"; }
  }
}

async function saveTask() {
  const id = document.getElementById("task-form-id").value;
  const name = document.getElementById("task-form-name").value.trim();
  const prompt = document.getElementById("task-form-prompt").value.trim();
  const icon = document.getElementById("task-form-icon").value.trim() || "📋";

  const toolsStr = document.getElementById("task-form-tools").value.trim();

    ? toolsStr.split(",").map((s) => s.trim()).filter(Boolean)
    : [];

  if (!prompt) { alert("Prompt 不能为空"); return; }

  const btn = document.getElementById("task-save-btn");
  btn.disabled = true;
  btn.textContent = "保存中…";

        method: "PATCH",
        headers: { "Content-Type": "application/json", ...getAuthHeaders() },
        body: JSON.stringify(body),
      });

async function openTaskSession(task) {
  currentDetailTaskId = task.id;
  currentDetailTask = task;
  // 判断：内置任务（推荐）→ 每次新会话；用户创建的任务 → 复用 task-{id}
  const isBuiltin = !!task.is_builtin;
  let sid;
  if (isBuiltin) {
    // 内置任务：用时间戳生成新会话，只有发消息时才真正创建
    sid = `task-${task.id}-${Date.now()}`;
    currentDetailSessionId = sid;   // 临时记下
  } else {
    sid = `task-${task.id}`;
    currentDetailSessionId = sid;
  }
  document.getElementById("task-detail-title").textContent =
    (task.icon || "") + " " + task.name;
  document.getElementById("task-detail-subtitle").textContent =
    task.description || "";

  const messagesEl = document.getElementById("task-detail-messages");
  messagesEl.innerHTML = '<div class="placeholder" style="padding-top:40px;">加载中…</div>';

  // 预设 prompt 到输入框（用户可自由修改）
  // 只有"为你推荐"（内置模板）才预填 prompt
  // 已创建的任务：输入框留空，等用户新输入
  const inputEl = document.getElementById("task-detail-input");
  if (isBuiltin) {
    inputEl.value = task.prompt || "";
    inputEl.style.height = "auto";
    setTimeout(() => {
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }, 0);
  } else {
    inputEl.value = "";
    inputEl.style.height = "auto";
  }
  switchTab("task-detail");

  // 内置任务（推荐）：不加载历史（新会话）
  if (isBuiltin) {
    messagesEl.innerHTML = "";
    return;   // 提前返回
  }

  // 用户任务：加载历史
  try {
    const r = await fetch(API + `/sessions/${encodeURIComponent(sid)}/history`, {
      headers: { ...getAuthHeaders() },
    });
    messagesEl.innerHTML = "";
    if (!r.ok) {
      if (r.status === 404) return;
      throw new Error(`HTTP ${r.status}`);
    }
    const data = await r.json();
    (data.messages || []).forEach((m) => renderDetailMessage(m));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  } catch (e) {
    messagesEl.innerHTML = `<div class="placeholder" style="padding-top:40px;">❌ 加载失败：${escapeHtml(e.message)}</div>`;
  }

  setTimeout(() => document.getElementById("task-detail-input").focus(), 100);
}

function renderDetailMessage(m) {
  const messagesEl = document.getElementById("task-detail-messages");

  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

      tip.style.cssText = "color:#86868b;font-size:12px;margin-top:6px;";
      tip.textContent = "（已中断）";
      bubble.appendChild(tip);
    }
        // 耗时显示
    if (m.elapsed_ms != null) {
      const meta = document.createElement("div");
      meta.className = "elapsed";
      let html = `⏱ ${formatMs(m.elapsed_ms)}`;
      if (m.ttft_ms != null) {
        html += `<span class="sep">·</span>首字 ${formatMs(m.ttft_ms)}`;
      }
      meta.innerHTML = html;
      wrap.appendChild(meta);
    }


  } else {
    bubble.textContent = m.content || "";
  }
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrap, bubble };
}

async function sendDetail() {
  if (detailBusy) return;
  const input = document.getElementById("task-detail-input");
  const text = input.value.trim();
  if (!text) return;

  detailBusy = true;
  const sendBtn = document.getElementById("task-detail-send");
  const stopBtn = document.getElementById("task-detail-stop");
  sendBtn.style.display = "none";
  stopBtn.style.display = "block";
  detailAbort = new AbortController();
  input.value = "";
  input.style.height = "auto";

  const messagesEl = document.getElementById("task-detail-messages");
  // 清掉占位符
  messagesEl.querySelector(".placeholder")?.remove();

  // 追加用户消息
  renderDetailMessage({ role: "user", content: text });

  // 追加 AI 空消息
  const aiWrap = document.createElement("div");
  aiWrap.className = "msg assistant";
  aiWrap.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble cursor"></div>
  `;
  const aiBubble = aiWrap.querySelector(".bubble");
  messagesEl.appendChild(aiWrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  const sid = currentDetailSessionId || `task-${currentDetailTaskId}`;

  try {
    const resp = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...getAuthHeaders() },
      body: JSON.stringify({ session_id: sid, message: text }),
      signal: detailAbort.signal,
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;
        let evt;
        try { evt = JSON.parse(raw.slice(6)); } catch { continue; }
        if (evt.kind === "content") {
          aiBubble.textContent += evt.text;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (evt.kind === "done") {
          aiBubble.classList.remove("cursor");
          aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(aiBubble.textContent || evt.reply || ""));
          // ← 新增：显示耗时
          if (evt.elapsed_ms != null) {
            const meta = document.createElement("div");
            meta.className = "elapsed";
            let html = `⏱ ${formatMs(evt.elapsed_ms)}`;
            if (evt.ttft_ms != null) {
              html += `<span class="sep">·</span>首字 ${formatMs(evt.ttft_ms)}`;
            }
            meta.innerHTML = html;
            aiWrap.appendChild(meta);
          }
        }
        else if (evt.kind === "error") {
          aiBubble.classList.remove("cursor");
          aiBubble.innerHTML = `<span class="error">❌ ${escapeHtml(evt.error)}</span>`;
        }
      }
    }
  } catch (e) {
    aiBubble.classList.remove("cursor");
    if (e.name !== "AbortError") {
      aiBubble.innerHTML = `<span class="error">❌ ${escapeHtml(e.message)}</span>`;
    }
  } finally {
    detailBusy = false;
    detailAbort = null;
    sendBtn.style.display = "block";
    stopBtn.style.display = "none";
    input.focus();
  }
}

async function stopDetail() {
  if (detailAbort) detailAbort.abort();
  try {
    await fetch(API + "/chat/cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...getAuthHeaders() },
      body: JSON.stringify({ session_id: currentDetailSessionId || `task-${currentDetailTaskId}` }),
    });
  } catch (e) { /* 忽略 */ }
}

async function runCurrentDetailTask() {
  if (!currentDetailTask) return;

async function editScheduledCron(task) {
  const presets = [
    "0 8 * * *    每天 08:00",
    "0 9 * * *    每天 09:00",
    "0 22 * * *   每天 22:00",
    "0 9 * * 1    每周一 09:00",
    "0 9 1 * *    每月 1 号 09:00",
  ].join("\n");

  const newCron = prompt(
    `编辑执行时间（cron 表达式，5 段：分 时 日 月 周）\n\n常用：\n${presets}\n\n当前：${task.schedule || "无"}`,
    task.schedule || "0 9 * * *"
  );
  if (newCron === null) return;
  const trimmed = newCron.trim();
  if (!trimmed || trimmed === task.schedule) return;
  // 改 schedule 时，同时把 trigger_type 设为 scheduled
  const ok = await updateScheduledField(task.id, {
    schedule: trimmed,
    trigger_type: "scheduled",
  });
  if (ok) {
    task.schedule = trimmed;
    task.trigger_type = "scheduled";
    document.getElementById("sched-schedule-text").textContent =
      _humanCron(trimmed) + "  ›";
  }
}

async function editScheduledPrompt(task) {
  const newPrompt = prompt("编辑任务指令：", task.prompt || "");
  if (newPrompt === null || newPrompt.trim() === task.prompt) return;
  const ok = await updateScheduledField(task.id, { prompt: newPrompt.trim() });
  if (ok) {
    task.prompt = newPrompt.trim();
    document.getElementById("sched-prompt-text").textContent = newPrompt.trim();
  }
}

// ============ 三点菜单 ============
let _menuCurrentTask = null;

function showTaskMenu(event, task, mode) {
  const dropdown = document.getElementById("task-menu-dropdown");
  _menuCurrentTask = task;

  const items = [];

  // 非内置任务：可删除
  if (!task.is_builtin) {
    items.push({ label: "删除", danger: true, action: () => deleteTask(task.id, task.name) });
  }

  // scheduled 任务：可暂停/启用
  if (task.trigger_type === "scheduled") {
    if (task.enabled) {
      items.push({ label: "暂停", action: () => toggleTaskEnabled(task.id, 0) });
    } else {
      items.push({ label: "启用", action: () => toggleTaskEnabled(task.id, 1) });
    }
  }

  if (items.length === 0) {
    items.push({ label: "无操作", action: () => {} });
  }

  dropdown.innerHTML = items.map((it, i) =>
    `<div class="task-menu-item ${it.danger ? "danger" : ""}" data-idx="${i}">${escapeHtml(it.label)}</div>`
  ).join("");

  // 定位
  const rect = event.currentTarget.getBoundingClientRect();
  dropdown.style.top = (rect.bottom + 4) + "px";
  dropdown.style.right = (window.innerWidth - rect.right) + "px";
  dropdown.style.left = "auto";
  dropdown.classList.add("active");

  // 绑定动作
  dropdown.querySelectorAll(".task-menu-item").forEach((el, i) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      hideTaskMenu();
      items[i].action();
    });
  });
}

function hideTaskMenu() {
  document.getElementById("task-menu-dropdown").classList.remove("active");
  _menuCurrentTask = null;
}

// 点其他位置关闭
document.addEventListener("click", () => hideTaskMenu());

async function toggleTaskEnabled(taskId, enabled) {
  try {
    const r = await fetch(API + `/tasks/${taskId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", ...getAuthHeaders() },
      body: JSON.stringify({ enabled }),
    });
    if (!r.ok) {
      alert("更新失败：" + (await r.text()));
      return;
    }
    await loadTasks();
  } catch (e) {
    alert("更新失败：" + e.message);
  }
}
// ============ 任务创建页 ============
let currentCreateDraftId = null;
let createBusy = false;
let createHasSentMsg = false;

function openTaskCreate(draftId) {
  currentCreateDraftId = draftId;
  createHasSentMsg = false;
  createBusy = false;

  document.getElementById("task-create-input").value = "";
  document.getElementById("task-create-input").style.height = "auto";
  document.getElementById("task-create-messages").innerHTML = "";
  document.getElementById("task-create-messages").style.display = "none";
  document.getElementById("task-create-blank").style.display = "block";
  document.getElementById("create-suggestions").style.display = "flex";
  document.getElementById("create-suggestions").innerHTML = `
    <button class="suggest-chip" onclick="fillTaskCreate('帮我准备即将参加的会议')">
      <span>🖥</span> 帮我准备即将参加的会议
    </button>
    <button class="suggest-chip" onclick="fillTaskCreate('帮我做一份市场调研')">
      <span>📊</span> 帮我做一份市场调研
    </button>
    <button class="suggest-chip" onclick="fillTaskCreate('帮我准备旅行行李清单')">
      <span>🧳</span> 帮我准备旅行行李清单
    </button>
  `;
  document.getElementById("task-create-send").disabled = false;

  switchTab("task-create");
  setTimeout(() => document.getElementById("task-create-input").focus(), 100);
}

function closeTaskCreate() {
  // 没发过消息就删除 draft
  if (currentCreateDraftId && !createHasSentMsg) {
    fetch(API + `/tasks/${currentCreateDraftId}`, {
      method: "DELETE",
      headers: { ...getAuthHeaders() },
    }).catch(() => {});
  }
  currentCreateDraftId = null;
  switchTab("tasks");
  loadTasks();
}

function fillTaskCreate(text) {
  const input = document.getElementById("task-create-input");
  input.value = text;
  input.focus();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

function appendCreateMsg(role, text) {
  const messagesEl = document.getElementById("task-create-messages");
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `
    <div class="avatar">${role === "user" ? "你" : "AI"}</div>
    <div class="bubble"></div>
  `;
  const bubble = wrap.querySelector(".bubble");
  if (text) {
    if (role === "user") bubble.textContent = text;
    else bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
  }
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function sendTaskCreate() {
  if (createBusy || !currentCreateDraftId) return;
  const input = document.getElementById("task-create-input");
  const text = input.value.trim();
  if (!text) return;

  createBusy = true;
  createHasSentMsg = true;
  input.value = "";
  input.style.height = "auto";

  // 切换到消息视图
  document.getElementById("task-create-blank").style.display = "none";
  document.getElementById("create-suggestions").style.display = "none";
  document.getElementById("task-create-messages").style.display = "flex";

  appendCreateMsg("user", text);
  const aiBubble = appendCreateMsg("assistant", "");
  aiBubble.classList.add("cursor");

  const sendBtn = document.getElementById("task-create-send");
  sendBtn.disabled = true;

  const sid = `task-${currentCreateDraftId}`;
  let content = "";
  let finalized = false;

  try {
    const resp = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...getAuthHeaders() },
      body: JSON.stringify({ session_id: sid, message: text }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;
        let evt;
        try { evt = JSON.parse(raw.slice(6)); } catch { continue; }
        if (evt.kind === "content") {
          content += evt.text;
          aiBubble.textContent = content;
          document.getElementById("task-create-messages").scrollTop = 999999;
        } else if (evt.kind === "tool_call") {
          if (evt.name === "finalize_task" && evt.success) finalized = true;
        } else if (evt.kind === "done") {
          aiBubble.classList.remove("cursor");
          aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(content || evt.reply || ""));
        } else if (evt.kind === "error") {
          aiBubble.classList.remove("cursor");
          aiBubble.innerHTML = `<span class="error">❌ ${escapeHtml(evt.error)}</span>`;
        }
      }
    }

    // Agent 完成后，显示完成状态
    if (finalized) {
      const sugg = document.getElementById("create-suggestions");
      sugg.style.display = "flex";
      sugg.innerHTML = `
        <button class="suggest-chip" onclick="closeTaskCreate()" style="background:#e6f4ea;color:#1e8e3e;justify-content:center;width:100%;">
          ✓ 任务已创建，点击返回
        </button>
      `;
    } else {
      // 还没完成——恢复预设提示词让用户继续对话
      const sugg = document.getElementById("create-suggestions");
      sugg.style.display = "flex";
      sugg.innerHTML = `
        <button class="suggest-chip" onclick="fillTaskCreate('改成每天早上 8 点')">
          ⏰ 改成每天早上 8 点
        </button>
      `;
    }
  } catch (e) {
    aiBubble.classList.remove("cursor");
    aiBubble.innerHTML = `<span class="error">❌ ${escapeHtml(e.message)}</span>`;
  } finally {
    createBusy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}
